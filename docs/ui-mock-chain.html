<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chain view — redesigned mock (after)</title>
<style>
/* ===========================================================================
   PROPOSED CSS — visual-first block/channel view.
   Base tokens copied verbatim from ui/src/styles.css; everything below the
   "proposed" marker is new/changed. Class names are the proposed names.
   =========================================================================== */
:root {
  --bg: #101116;
  --panel: #17181d;
  --panel-2: #1d1f26;
  --line: #2a2d36;
  --line-soft: #22242c;
  --text: #e8eaef;
  --muted: #8b909c;
  --amber: #e8a33d;
  --amber-dim: #7a5c25;
  --radius: 9px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #app { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  font-size: 13px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; }
svg { display: block; }

.app { display: grid; grid-template-rows: 58px 1fr 208px; height: 100%; }

/* --- top bar (unchanged, context only) --------------------------------- */
.topbar {
  display: flex; align-items: center; gap: 18px; padding: 0 16px;
  background: linear-gradient(#1e2027, #16171c);
  border-bottom: 1px solid var(--line); min-width: 0;
}
.preset { display: flex; align-items: center; gap: 8px; min-width: 230px; }
.nav {
  width: 26px; height: 26px; border-radius: 5px; background: #26282f;
  border: 1px solid var(--line); color: var(--muted); line-height: 1;
}
.preset-name { font-size: 14px; font-weight: 600; }
.preset-name small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; text-transform: capitalize; }
.slots { display: flex; gap: 4px; }
.slot {
  width: 26px; height: 26px; border-radius: 5px; background: #22242b;
  border: 1px solid var(--line-soft); color: var(--muted); font-size: 11px; font-weight: 600;
  display: grid; place-items: center;
}
.slot.on {
  background: linear-gradient(#f0b453, #d18f22); border-color: #f5c877;
  color: #23180a; box-shadow: 0 0 12px rgba(232, 163, 61, 0.35);
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.source-toggle { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.chip {
  padding: 5px 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
  text-transform: uppercase; background: #1a1b21; color: var(--muted);
  border-right: 1px solid var(--line-soft);
}
.chip:last-child { border-right: none; }
.chip.on { background: #2f323b; color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.meter { display: grid; gap: 3px; justify-items: center; }
.meter-track {
  width: 8px; height: 22px; background: #121318; border: 1px solid var(--line-soft);
  border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden;
}
.meter-fill { width: 100%; background: #4a8f5c; }
.meter-label { font-size: 9px; color: var(--muted); letter-spacing: 0.6px; }

.main { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }

/* --- rack (unchanged, context only) ------------------------------------ */
.rack { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
.rack h2 {
  display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1.4px;
  margin: 14px 2px 6px; font-weight: 600; color: var(--cat);
}
.rack h2:first-child { margin-top: 2px; }
.rack-item {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 6px; margin-bottom: 3px; text-align: left;
  border: 1px solid transparent; border-left: 3px solid var(--cat);
  background: linear-gradient(90deg, var(--cat-soft), transparent 70%);
}
.rack-icon { color: var(--cat); display: grid; place-items: center; }
.rack-name { font-size: 12px; font-weight: 500; }

/* ===========================================================================
   PROPOSED — chain
   =========================================================================== */

/* No `.chain-label`, no `.hint`: the panel is self-evident. */

.chain-panel {
  background: radial-gradient(120% 90% at 50% 0%, #1a1c22 0%, #101116 70%);
  padding: 12px 16px;
  overflow: auto;
  min-width: 0;
}
.chain-scroll { display: grid; gap: 10px; }

.channel {
  background: rgba(255, 255, 255, 0.012);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 8px 10px 10px;
  transition: border-color 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
}
.channel.drop-target-active {
  border-color: var(--amber-dim);
  background: rgba(232, 163, 61, 0.05);
  box-shadow: 0 0 0 1px var(--amber-dim), 0 0 22px rgba(232, 163, 61, 0.22);
}

/* --- channel header: chip + volume + one source toggle ---------------- */
.channel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  margin-bottom: 8px;
}

/* Identity: a number chip, not the word "Channel". */
.channel-chip {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: #1a1b21;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Volume: a 16px speaker glyph + slider. Value lives in the tooltip. */
.channel-vol {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
}
.channel-vol input[type="range"] {
  width: 96px;
  accent-color: var(--amber);
}

/* Input source: one 24x24 icon button, on/off carried by colour. */
.channel-src {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: #1a1b21;
  border: 1px solid var(--line);
  color: var(--muted);
}
.channel-src.on {
  background: #2a2318;
  border-color: var(--amber-dim);
  color: var(--amber);
}

/* --- strip ------------------------------------------------------------ */
.strip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 18px 8px;
}
.strip::before {
  content: "";
  position: absolute;
  top: 50%; left: 8px; right: 8px;
  height: 2px;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, #3d414d 7%, #3d414d 93%, transparent);
  border-radius: 1px;
}
.strip > * { position: relative; z-index: 1; }

/* Endpoints: a jack-socket glyph, no text. */
.port {
  flex: none;
  width: 14px;
  height: 14px;
  display: grid;
  place-items: center;
  color: #5b6070;
}

/* --- block card: icon-first ------------------------------------------- */
.block-card {
  --cat: hsl(var(--cat-h, 222) 62% 58%);
  --cat-soft: hsl(var(--cat-h, 222) 45% 20%);
  flex: none;
  width: 116px;
  height: 64px;
  border-radius: 8px;
  background: linear-gradient(155deg, var(--cat-soft) 0%, #1b1c22 62%);
  border: 1px solid #353843;
  border-left: 3px solid var(--cat);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  display: grid;
  grid-template-rows: 32px 1fr;
  align-content: center;
  justify-items: center;
  gap: 4px;
  padding: 8px;
  cursor: grab;
  position: relative;
  user-select: none;
  touch-action: none;
  transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
}
.block-card::before,
.block-card::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 5px; height: 5px;
  margin-top: -2.5px;
  border-radius: 50%;
  background: var(--cat);
  box-shadow: 0 0 5px var(--cat);
}
.block-card::before { left: -3px; }
.block-card::after { right: -3px; }
.block-card:hover { border-color: #4a4d59; }

.block-icon { color: var(--cat); display: grid; place-items: center; }
.block-icon:empty { display: none; }

/* One line, 10px, ellipsis. Full name lives in the tooltip. */
.block-name {
  font-size: 10px;
  font-weight: 600;
  line-height: 1.2;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.block-card.selected {
  border-color: var(--cat);
  box-shadow: 0 0 0 1px var(--cat), 0 4px 12px hsl(var(--cat-h, 222) 70% 55% / 0.3);
  transform: translateY(-1px);
}
.block-card.dragging { cursor: grabbing; border-style: dashed; border-color: #4a4d59; }

/* Bypass: dim + strike + amber power. No text needed. */
.block-card.bypass { opacity: 0.5; }
.block-card.bypass .block-name { text-decoration: line-through; }

/* Actions: hidden until hover / focus / selection. 24px hit areas. */
.card-actions {
  position: absolute;
  top: 4px;
  right: 4px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 120ms ease;
}
.block-card:hover .card-actions,
.block-card:focus-within .card-actions,
.block-card.selected .card-actions { opacity: 1; }

.icon-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: rgba(16, 17, 22, 0.88);
  border: 1px solid var(--line);
  color: var(--muted);
}
.icon-btn:hover { color: var(--text); border-color: #3a3d47; }
.icon-btn.bypass.on { background: var(--amber); color: #23180a; border-color: #f5c877; }
.icon-btn.remove:hover { color: #ff8a7a; border-color: #5a3535; }

/* --- empty channel: a dashed drop zone, no text ------------------------ */
.empty-zone {
  flex: 1 1 auto;
  min-width: 220px;
  height: 48px;
  border: 1px dashed #3f424d;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #4a4e5c;
}
.channel.drop-target-active .empty-zone {
  border-color: var(--amber-dim);
  background: rgba(232, 163, 61, 0.06);
  color: var(--amber);
}

/* --- add / placeholder ------------------------------------------------ */
.block-placeholder {
  flex: none;
  width: 0;
  margin-right: -8px;
  height: 64px;
  border-radius: 8px;
  border: 1px dashed transparent;
  overflow: hidden;
  transition: width 110ms ease, margin-right 110ms ease, border-color 110ms ease, background-color 110ms ease;
}
.block-placeholder.active {
  width: 116px;
  margin-right: 0;
  border-color: var(--amber-dim);
  background: rgba(232, 163, 61, 0.08);
}
.add-block {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px dashed #3f424d;
  color: var(--muted);
  display: grid;
  place-items: center;
}
.add-block:hover { color: var(--text); border-color: var(--amber); }

.strip > .drop-indicator {
  position: absolute;
  top: 14px; bottom: 14px;
  width: 2px; margin-left: -1px;
  border-radius: 1px;
  background: var(--amber);
  box-shadow: 0 0 8px rgba(232, 163, 61, 0.8);
  z-index: 2;
  pointer-events: none;
}
.drag-ghost {
  position: fixed;
  z-index: 40;
  transform: translate(-50%, -50%) scale(1.04);
  padding: 6px 12px;
  border-radius: 7px;
  background: linear-gradient(#3a3e49, #23252c);
  border: 1px solid var(--amber);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  pointer-events: none;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* --- editor (context only) -------------------------------------------- */
.editor {
  background: linear-gradient(#1a1b21, #14151a);
  border-top: 1px solid var(--line);
  padding: 14px 22px;
  display: grid;
  grid-template-columns: 210px 1fr;
  gap: 24px;
  align-items: center;
  min-height: 0;
}
.editor-id {
  --cat: hsl(var(--cat-h, 222) 62% 58%);
  --cat-soft: hsl(var(--cat-h, 222) 45% 20%);
  display: grid;
  gap: 3px;
  align-content: center;
  justify-items: start;
  padding-left: 12px;
  border-left: 3px solid var(--cat);
  background: linear-gradient(90deg, var(--cat-soft), transparent 75%);
  border-radius: 0 6px 6px 0;
  min-height: 96px;
}
.editor-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.editor-controls { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 14px 26px; }
.knob-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; }
.knob {
  width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #454956, #1a1b20 72%);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.14), inset 0 -3px 6px rgba(0, 0, 0, 0.5);
  position: relative;
}
.knob::after {
  content: ""; position: absolute; left: 50%; top: 5px;
  width: 3px; height: 18px; border-radius: 2px; background: #f4f6fa;
  transform-origin: 50% 22px;
  transform: translateX(-50%) rotate(var(--angle, 0deg));
}
.knob-name { font-size: 9px; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; text-transform: uppercase; text-align: center; }
.knob-value {
  font-size: 10px; color: var(--text); background: #121318; border: 1px solid var(--line-soft);
  border-radius: 4px; padding: 1px 6px; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="preset">

      <button class="rack-item" style="--cat-h:268"><span class="rack-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></span><span class="rack-name">Cab</span></button>

      <button class="rack-item" style="--cat-h:10"><span class="rack-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2l2.5-7 3 14 2.5-11 2.5 9H21"/></svg></span><span class="rack-name">Overdrive</span></button>
      <h2 style="--cat-h:206"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>TIME</h2>
      <button class="rack-item" style="--cat-h:206"><span class="rack-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h4v-4h4v-4h4V7h4M16.5 7H20v3.5"/></svg></span><span class="rack-name">Pitch Delay</span></button>
      <button class="rack-item" style="--cat-h:206"><span class="rack-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M10 8a5 5 0 0 1 0 8"/><path d="M14.5 4.5a10 10 0 0 1 0 15"/></svg></span><span class="rack-name">Reverb</span></button>
    </aside>

    <section class="chain-panel">
      <div class="chain-scroll">

        <!-- Channel 1: full chain -->
        <div class="channel">
          <div class="channel-head">
            <span class="channel-chip" title="Channel 1" aria-label="Channel 1">1</span>

                <button class="icon-btn remove" title="Remove Overdrive" aria-label="Remove Overdrive"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>

            <div class="block-card" style="--cat-h:268" title="Cab — drag to move">
              <span class="block-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></span>
              <span class="block-name" title="Cab">Cab</span>
