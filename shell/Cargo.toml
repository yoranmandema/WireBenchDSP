[package]
name = "pedal-shell"
version = "0.1.0"
edition = "2021"
description = "Pedal desktop shell: Tauri webview hosting the shared UI"

[[bin]]
name = "pedal-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
