[package]
name = "pedal-firmware"
version = "0.1.0"
edition = "2021"
description = "STM32H723 guitar pedal firmware — SAI/I2S audio, DMA double buffering, DSP chain"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32h7xx-hal = { version = "0.16", features = ["stm32h735", "rt"] }
pedal-dsp = { path = "../dsp", default-features = false }
embedded-hal = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.dev]
opt-level = 1
