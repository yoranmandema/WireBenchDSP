[package]
name = "pedal-engine"
version = "0.1.0"
edition = "2021"
description = "Pedal engine: state, audio, and the IPC server"

[lib]
name = "pedal_engine"
path = "src/lib.rs"

[[bin]]
name = "pedal-engine"
path = "src/main.rs"

[dependencies]
pedal-dsp = { path = "../dsp" }
dsp-graph = { path = "../graph" }
rtrb = "0.2"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
pedal-health = { path = "../health" }
