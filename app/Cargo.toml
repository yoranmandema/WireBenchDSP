[package]
name = "pedal-app"
version = "0.1.0"
edition = "2021"
description = "Desktop pedal editor: channels, presets, live audio"

[lib]
name = "pedal_app"
path = "src/lib.rs"

[[bin]]
name = "pedal-app"
path = "src/main.rs"

[dependencies]
pedal-dsp = { path = "../dsp" }
dsp-graph = { path = "../graph" }
pedal-engine = { path = "../engine" }
rtrb = "0.2"
cpal = "0.18"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
hound = "3.5"
rfd = "0.15"
