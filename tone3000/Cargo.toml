[package]
name = "pedal-tone3000"
version = "0.1.0"
edition = "2021"
description = "Typed TONE3000 v1 API client and refreshable local model index"

[lib]
name = "pedal_tone3000"
path = "src/lib.rs"

[[bin]]
name = "t3k-refresh-index"
path = "src/bin/refresh_index.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# rustls with the ring provider: builds with a C compiler alone, which keeps
# the (eventual) aarch64 Pi cross-build free of aws-lc/cmake.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "http2",
    "charset",
    "system-proxy",
    "query",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "1"
async-trait = "0.1"
unicode-normalization = "0.1"
# Validation of the cached index against docs/model-index.schema.json.
# default-features = false: no HTTP/file retrieval, no aws-lc-rs — the schema
# is embedded and fully self-contained.
jsonschema = { version = "0.61", default-features = false }

[dev-dependencies]
